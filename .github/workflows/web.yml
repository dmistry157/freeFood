# Publishes dhilen.com on GitHub Pages. Both pages here are redirects:
#   dhilen.com/          -> site/index.html          (to LinkedIn)
#   dhilen.com/freefood/ -> site/freefood/index.html (to calfreefood.com)
# The map itself is served by Vercel from web/ on calfreefood.com, so nothing is built
# here any more: Pages only needs these static files and the CNAME beside them.
name: web

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
