name: pipeline

on:
  schedule:
    - cron: "17 * * * *"   # hourly; run.py auto picks sources by the hour in America/Los_Angeles
    - cron: "41 12 * * 1"  # weekly keepalive only (see last step)
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: read
  actions: write            # lets the keepalive step re-enable this workflow

concurrency:
  group: pipeline
  cancel-in-progress: false # never run two at once (dedupe + quotas)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Run pipeline
        if: github.event.schedule != '41 12 * * 1'
        run: python -m pipeline.run auto
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      # GitHub disables scheduled workflows after 60 days without repo activity; re-enable weekly.
      - name: Keepalive
        if: github.event.schedule == '41 12 * * 1'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pipeline.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
