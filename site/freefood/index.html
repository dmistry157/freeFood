<!doctype html>
<!-- dhilen.com/freefood: the map moved to its own domain, so this forwards there.
     GitHub Pages serves static files only, with no server-side redirects, so this is
     the same meta-refresh + canonical + script trio the root page uses.
     The canonical tag is what hands the old address's search credit to the new one. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Berkeley Free Food</title>
  <meta http-equiv="refresh" content="0; url=https://calfreefood.com/">
  <link rel="canonical" href="https://calfreefood.com/">
  <meta name="robots" content="noindex, follow">
  <script>location.replace('https://calfreefood.com/');</script>
</head>
<body>
  <p><a href="https://calfreefood.com/">Berkeley Free Food has moved to calfreefood.com</a></p>
</body>
</html>
